<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#5b3a24">
<title>Ledger — Blessings Home</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<style>
  :root{
    --terracotta:#b5502a; --terracotta-dark:#8f3c1e;
    --cream:#faf6ef; --cream-dark:#f1e9db;
    --teak:#5b3a24; --teak-light:#6f4a30; --ink:#2b2118; --mut:#7a6a58;
    --palm:#3e6b46; --gold:#c99a3f; --danger:#c0392b;
    --radius:14px; --shadow:0 6px 24px rgba(43,33,24,.10);
    --side:212px; --bar:60px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* .shell sets display:flex, which would otherwise beat the UA [hidden] rule */
  [hidden]{display:none !important}
  body{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
       background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5;
       -webkit-font-smoothing:antialiased}
  a{color:inherit}

  /* ---------- shell ---------- */
  .shell{display:flex;min-height:100vh}
  aside{width:var(--side);background:var(--teak);color:var(--cream);
        display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30}
  aside .brand{padding:18px 18px 14px;border-bottom:1px solid rgba(250,246,239,.13)}
  aside .brand b{display:block;font-size:1rem;letter-spacing:.2px}
  aside .brand span{font-size:.62rem;opacity:.65;letter-spacing:2px;text-transform:uppercase}
  nav.side{padding:10px 0;flex:1}
  nav.side button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
        color:var(--cream);font:inherit;font-size:.9rem;text-align:left;padding:11px 18px;cursor:pointer;
        opacity:.72;border-left:3px solid transparent}
  nav.side button:hover{opacity:1;background:rgba(250,246,239,.06)}
  nav.side button.on{opacity:1;background:rgba(250,246,239,.10);border-left-color:var(--gold);font-weight:600}
  nav.side .ic{font-size:1.02rem;width:20px;text-align:center}
  nav.side .pill{margin-left:auto;background:var(--danger);color:#fff;font-size:.64rem;
        font-weight:700;border-radius:10px;padding:1px 7px}
  aside .foot{padding:14px 18px;border-top:1px solid rgba(250,246,239,.13);font-size:.68rem;opacity:.6}
  aside .foot button{background:none;border:1px solid rgba(250,246,239,.35);color:var(--cream);
        border-radius:20px;padding:6px 14px;font:inherit;font-size:.72rem;cursor:pointer;margin-bottom:8px}

  main{margin-left:var(--side);flex:1;padding:22px 26px 60px;max-width:1180px}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:18px}
  .head h1{font-size:1.22rem;color:var(--teak);font-weight:700}
  .head .sub{font-size:.78rem;color:var(--mut)}

  /* ---------- pieces ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
  .tile{background:#fff;border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow)}
  .tile .k{font-size:.67rem;letter-spacing:1.1px;text-transform:uppercase;color:var(--mut)}
  .tile .v{font-size:1.42rem;font-weight:700;color:var(--teak);margin-top:3px}
  .tile .s{font-size:.7rem;color:var(--mut);margin-top:2px}
  .tile.alert .v{color:var(--danger)}
  .tile.good .v{color:var(--palm)}

  section{margin-bottom:26px}
  h2{font-size:.98rem;color:var(--teak);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  h2 .count{background:var(--cream-dark);color:var(--mut);font-size:.66rem;padding:2px 9px;border-radius:12px;font-weight:600}

  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
       padding:13px 16px;border-bottom:1px solid var(--cream-dark)}
  .row:last-child{border-bottom:none}
  .row .who{font-weight:600}
  .row .meta{font-size:.78rem;color:var(--mut);margin-top:2px}
  .row .amt{font-weight:700;white-space:nowrap;text-align:right}
  .row.owed{border-left:4px solid var(--danger)}
  .row.owed .amt{color:var(--danger)}
  .tag{display:inline-block;font-size:.63rem;letter-spacing:.6px;text-transform:uppercase;
       padding:2px 8px;border-radius:10px;font-weight:700;margin-left:6px;vertical-align:1px}
  .t-airbnb{background:#fde8e6;color:#b5302a}
  .t-direct{background:#e2ecdf;color:var(--palm)}
  .t-agent{background:var(--cream-dark);color:var(--teak)}
  .t-bad{background:#f6d9d5;color:var(--danger)}
  .t-inv{background:#efe6f5;color:#6b4a86}
  .wa{color:var(--palm);text-decoration:none;font-size:.78rem;font-weight:600;white-space:nowrap}

  .empty{padding:18px 16px;color:var(--mut);font-size:.88rem}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:.83rem;min-width:620px}
  th{background:var(--teak);color:var(--cream);text-align:left;padding:9px 12px;
     font-size:.68rem;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0}
  td{padding:9px 12px;border-bottom:1px solid var(--cream-dark);vertical-align:top}
  td.num,th.num{text-align:right;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fdfbf7}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .filters input,.filters select{font:inherit;font-size:.85rem;padding:8px 12px;border-radius:22px;
     border:1px solid var(--cream-dark);background:#fff;color:var(--ink);outline:none}
  .filters input{flex:1;min-width:150px}
  .filters input:focus,.filters select:focus{border-color:var(--terracotta)}

  .err{background:#fdeceb;border-left:4px solid var(--danger);padding:14px 16px;
       border-radius:8px;color:#7d241b;font-size:.88rem;margin-bottom:18px}
  .note{font-size:.75rem;color:var(--mut);margin-top:8px}

  /* ---------- gate ---------- */
  .gate{max-width:460px;margin:12vh auto;text-align:center;padding:0 20px}
  .gate h1{font-size:1.35rem;margin-bottom:10px;color:var(--teak)}
  .gate p{color:var(--mut);margin-bottom:24px;font-size:.93rem}
  .btn{border:none;border-radius:30px;padding:11px 24px;font:inherit;font-size:.9rem;
       cursor:pointer;background:var(--terracotta);color:#fff}
  .btn:hover{background:var(--terracotta-dark)}

  /* ---------- mobile ---------- */
  @media(max-width:760px){
    aside{inset:auto 0 0 0;width:100%;height:var(--bar);flex-direction:row;
          border-top:1px solid rgba(250,246,239,.15);padding-bottom:env(safe-area-inset-bottom)}
    aside .brand,aside .foot{display:none}
    nav.side{display:flex;padding:0;flex:1}
    nav.side button{flex-direction:column;gap:2px;justify-content:center;padding:8px 2px;
          font-size:.6rem;border-left:none;border-top:3px solid transparent;text-align:center}
    nav.side button.on{border-left:none;border-top-color:var(--gold);background:rgba(250,246,239,.10)}
    nav.side .ic{font-size:1.15rem;width:auto}
    nav.side .pill{position:absolute;transform:translate(16px,-10px);margin:0}
    main{margin-left:0;padding:16px 14px calc(var(--bar) + 26px);max-width:none}
    .head h1{font-size:1.08rem}
    .tile .v{font-size:1.25rem}
  }
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>Private ledger</h1>
  <p>Bookings, payments, expenses and inventory for Blessings Home.
     Sign in with the owner's Google account — nobody else can load this data.</p>
  <button class="btn" id="signin">Sign in with Google</button>
  <div class="note" id="gate-note"></div>
</div>

<div class="shell" id="shell" hidden>
  <aside>
    <div class="brand"><b>Blessings Home</b><span>Ledger</span></div>
    <nav class="side" id="nav"></nav>
    <div class="foot">
      <button id="refresh">↻ Refresh</button>
      <div>Read-only view</div>
    </div>
  </aside>
  <main id="view"></main>
</div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
